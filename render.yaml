services:
  - type: web
    name: vyahmandap
    runtime: python
    repo: https://github.com/shreeshyamevents/vyahmandap1
    plan: free
    region: ohio
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
