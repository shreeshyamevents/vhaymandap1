services:
  - type: web
    name: vyahmandap
    runtime: python
    repo: https://github.com/shreeshyamevents/vyahmandap1
    plan: free
    region: ohio
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      # Shared rate-limit storage across gunicorn workers
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: vyahmandap-redis
          property: connectionString

  - type: keyvalue
    name: vyahmandap-redis
    plan: free
    region: ohio            # must match the web service region
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []         # internal connections only
