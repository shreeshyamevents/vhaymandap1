{% extends "base.html" %}

{% block title %}Forgot Password - VyahMandap{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
    <div class="bg-white p-8 rounded-2xl border shadow-sm">
        <div class="text-center mb-6">
            <div class="w-14 h-14 bg-plum-600 rounded-2xl mx-auto flex items-center justify-center text-white font-bold text-2xl">VM</div>
            <h3 class="text-2xl font-bold mt-3">Forgot Password?</h3>
            <p class="text-sm text-gray-500 mt-1">We'll send a reset link to your email</p>
        </div>

        <form method="POST" class="space-y-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div>
                <label class="block font-semibold text-sm mb-1">Registered Email</label>
                <input type="email" name="email" required placeholder="your@email.com"
                       class="w-full border rounded-lg p-3 text-sm">
                <p class="text-xs text-gray-500 mt-1">Use the email you registered with.</p>
            </div>
            <button type="submit" class="w-full bg-plum-600 text-white font-bold py-3 rounded-xl hover:bg-plum-700 transition">
                Send Reset Link
            </button>
        </form>

        <p class="text-center text-sm text-gray-500 mt-4">
            Remembered it? <a href="{{ url_for('login') }}" class="text-plum-600 font-bold hover:underline">Back to Login</a>
        </p>
    </div>
</div>
{% endblock %}
