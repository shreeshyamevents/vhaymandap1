{% extends "base.html" %}

{% block title %}Register - VyahMandap{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
    <div class="bg-white p-8 rounded-2xl border shadow-sm">
        <div class="text-center mb-6">
            <div class="w-14 h-14 bg-green-700 rounded-2xl mx-auto flex items-center justify-center text-white font-bold text-2xl">VM</div>
            <h3 class="text-2xl font-bold mt-3">Create Account</h3>
            <p class="text-sm text-gray-500">Join VyahMandap today</p>
        </div>

        <form method="POST" class="space-y-4">
            <div>
                <label class="block font-semibold text-sm mb-1">Full Name *</label>
                <input type="text" name="name" required placeholder="Your full name" class="w-full border rounded-lg p-3 text-sm">
            </div>
            <div>
                <label class="block font-semibold text-sm mb-1">Mobile Number *</label>
                <input type="text" name="mobile" required placeholder="10-digit mobile" class="w-full border rounded-lg p-3 text-sm">
            </div>
            <div>
                <label class="block font-semibold text-sm mb-1">Email (optional)</label>
                <input type="email" name="email" placeholder="your@email.com" class="w-full border rounded-lg p-3 text-sm">
            </div>
            <div>
                <label class="block font-semibold text-sm mb-1">Password *</label>
                <input type="password" name="password" required placeholder="Min 6 characters" class="w-full border rounded-lg p-3 text-sm">
            </div>
            <div>
                <label class="block font-semibold text-sm mb-1">Confirm Password *</label>
                <input type="password" name="confirm_password" required placeholder="Re-enter password" class="w-full border rounded-lg p-3 text-sm">
            </div>
            <button type="submit" class="w-full bg-green-700 text-white font-bold py-3 rounded-xl hover:bg-green-600 transition">
                Create Account
            </button>
        </form>

        <p class="text-center text-sm text-gray-500 mt-4">
            Already have an account? <a href="{{ url_for('auth.login') }}" class="text-green-700 font-bold hover:underline">Login</a>
        </p>
    </div>
</div>
{% endblock %}
