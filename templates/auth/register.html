{% extends "base.html" %}

{% block title %}Register - VyahMandap{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
    <div class="bg-white p-8 rounded-2xl border shadow-sm">
        <div class="text-center mb-6">
            <div class="w-14 h-14 bg-plum-600 rounded-2xl mx-auto flex items-center justify-center text-white font-bold text-2xl">VM</div>
            <h3 class="text-2xl font-bold mt-3">Create Account</h3>
            <p class="text-sm text-gray-500">Join VyahMandap today</p>
        </div>

        <form method="POST" class="space-y-4">
            <div>
                <label class="block font-semibold text-sm mb-1">Full Name *</label>
                <input type="text" name="name" required placeholder="Your full name" class="w-full border rounded-lg p-3 text-sm">
            </div>
            <div>
                <label class="block font-semibold text-sm mb-1">Mobile Number *</label>
                <input type="text" name="mobile" required placeholder="10-digit mobile" pattern="\d{10}" maxlength="10" class="w-full border rounded-lg p-3 text-sm">
            </div>
            <div>
                <label class="block font-semibold text-sm mb-1">Email *</label>
                <input type="email" name="email" required placeholder="your@email.com" class="w-full border rounded-lg p-3 text-sm">
            </div>
            <div>
                <label class="block font-semibold text-sm mb-1">Account Type *</label>
                <select name="account_type" id="account_type" required class="w-full border rounded-lg p-3 text-sm bg-white">
                    <option value="customer">Customer (I want to book equipment)</option>
                    <option value="vendor">Vendor (I want to rent out my equipment)</option>
                </select>
            </div>
            <div id="company_name_wrap" class="hidden">
                <label class="block font-semibold text-sm mb-1">Company Name (optional)</label>
                <input type="text" name="company_name" placeholder="Your business name" class="w-full border rounded-lg p-3 text-sm">
            </div>
            <div>
                <label class="block font-semibold text-sm mb-1">Password *</label>
                <input type="password" name="password" required placeholder="Min 6 characters" minlength="6" class="w-full border rounded-lg p-3 text-sm">
            </div>
            <div>
                <label class="block font-semibold text-sm mb-1">Confirm Password *</label>
                <input type="password" name="confirm_password" required placeholder="Re-enter password" minlength="6" class="w-full border rounded-lg p-3 text-sm">
            </div>

            <!-- DPDP Consent Checkbox -->
            <div class="flex items-start gap-2 pt-2">
                <input type="checkbox" name="terms_accepted" id="terms_accepted" required
                       class="mt-1 w-4 h-4 cursor-pointer accent-plum-600">
                <label for="terms_accepted" class="text-xs text-gray-700 cursor-pointer leading-relaxed">
                    I agree to the <a href="{{ url_for('terms') }}" target="_blank" class="text-plum-600 underline font-semibold">Terms of Service</a>
                    and <a href="{{ url_for('privacy') }}" target="_blank" class="text-plum-600 underline font-semibold">Privacy Policy</a>.
                    I understand my data will be processed as described.
                </label>
            </div>

            <button type="submit" class="w-full bg-plum-600 text-white font-bold py-3 rounded-xl hover:bg-plum-700 transition">
                Create Account
            </button>
        </form>

        <p class="text-center text-sm text-gray-500 mt-4">
            Already have an account? <a href="{{ url_for('login') }}" class="text-plum-600 font-bold hover:underline">Login</a>
        </p>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const accountType = document.getElementById('account_type');
    const companyWrap = document.getElementById('company_name_wrap');
    function toggleCompany() {
        if (accountType.value === 'vendor') {
            companyWrap.classList.remove('hidden');
        } else {
            companyWrap.classList.add('hidden');
        }
    }
    accountType.addEventListener('change', toggleCompany);
    // Preselect vendor when arriving from the "Become a Vendor" button (?type=vendor)
    if (new URLSearchParams(window.location.search).get('type') === 'vendor') {
        accountType.value = 'vendor';
    }
    toggleCompany();
});
</script>
{% endblock %}
