{% extends "base.html" %}

{% block title %}Login - VyahMandap{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
    <div class="bg-white p-8 rounded-2xl border shadow-sm">
        <div class="text-center mb-6">
            <div class="w-14 h-14 bg-plum-600 rounded-2xl mx-auto flex items-center justify-center text-white font-bold text-2xl">VM</div>
            <h3 class="text-2xl font-bold mt-3">Welcome Back</h3>
            <p class="text-sm text-gray-500">Login to your VyahMandap account</p>
        </div>

        {% if google_enabled %}
        <a href="{{ url_for('google_login') }}"
           class="w-full flex items-center justify-center gap-3 border-2 border-gray-200 hover:border-gray-300 hover:bg-gray-50 text-gray-700 font-semibold py-3 rounded-xl transition mb-4">
            <svg width="20" height="20" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.2-.1-2.4-.4-3.5z"/>
                <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 18.9 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
                <path fill="#4CAF50" d="M24 44c5.4 0 10.3-2.1 14-5.4l-6.5-5.5c-2 1.5-4.7 2.4-7.5 2.4-5.3 0-9.7-3.1-11.3-7.6l-6.5 5c3.4 6.4 10 10.6 17.8 10.6z"/>
                <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.3 5.7l6.5 5.5C41.9 35.6 44 30.3 44 24c0-1.2-.1-2.4-.4-3.5z"/>
            </svg>
            Continue with Google
        </a>

        <div class="flex items-center gap-3 mb-4">
            <div class="flex-1 h-px bg-gray-200"></div>
            <span class="text-xs text-gray-400 font-medium">OR</span>
            <div class="flex-1 h-px bg-gray-200"></div>
        </div>
        {% endif %}

        <form method="POST" class="space-y-4">
            <div>
                <label class="block font-semibold text-sm mb-1">Mobile Number</label>
                <input type="text" name="mobile" required placeholder="Enter 10-digit mobile" class="w-full border rounded-lg p-3 text-sm">
            </div>

            <div>
                <label class="block font-semibold text-sm mb-1">Password</label>
                <div class="relative">
                    <input type="password" name="password" id="passwordInput" required placeholder="Your password" class="w-full border rounded-lg p-3 text-sm pr-10">
                    <button type="button" onclick="togglePassword()" aria-label="Show password"
                            class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 transition">
                        <i class="fas fa-eye" id="eyeIcon"></i>
                    </button>
                </div>
            </div>

            <div class="text-right -mt-2">
                <a href="{{ url_for('forgot_password') }}" class="text-xs text-plum-600 hover:underline font-medium">
                    Forgot password?
                </a>
            </div>

            <button type="submit" class="w-full bg-plum-600 text-white font-bold py-3 rounded-xl hover:bg-plum-700 transition">
                Sign In
            </button>
        </form>

        <p class="text-center text-sm text-gray-500 mt-4">
            Don't have an account? <a href="{{ url_for('register') }}" class="text-plum-600 font-bold hover:underline">Register</a>
        </p>
    </div>
</div>

<script>
function togglePassword() {
    var input = document.getElementById('passwordInput');
    var icon = document.getElementById('eyeIcon');
    if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
    } else {
        input.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
    }
}
</script>
{% endblock %}
