{% extends "base.html" %}

{% block title %}Reset Password - VyahMandap{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
    <div class="bg-white p-8 rounded-2xl border shadow-sm">
        <div class="text-center mb-6">
            <div class="w-14 h-14 bg-plum-600 rounded-2xl mx-auto flex items-center justify-center text-white font-bold text-2xl">VM</div>
            <h3 class="text-2xl font-bold mt-3">Set New Password</h3>
            <p class="text-sm text-gray-500 mt-1">Choose a strong password</p>
        </div>

        <form method="POST" class="space-y-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div>
                <label class="block font-semibold text-sm mb-1">New Password</label>
                <input type="password" name="password" required minlength="8"
                       placeholder="Min 8 chars, 1 letter, 1 number"
                       class="w-full border rounded-lg p-3 text-sm">
            </div>
            <div>
                <label class="block font-semibold text-sm mb-1">Confirm Password</label>
                <input type="password" name="confirm_password" required minlength="8"
                       placeholder="Re-enter password"
                       class="w-full border rounded-lg p-3 text-sm">
            </div>
            <button type="submit" class="w-full bg-plum-600 text-white font-bold py-3 rounded-xl hover:bg-plum-700 transition">
                Reset Password
            </button>
        </form>

        <p class="text-center text-sm text-gray-500 mt-4">
            <a href="{{ url_for('login') }}" class="text-plum-600 font-bold hover:underline">Back to Login</a>
        </p>
    </div>
</div>
{% endblock %}
